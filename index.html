<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Araç İletişim Asistanı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 relative">
        
        <!-- Araç Bilgi Alanı -->
        <div class="text-center mb-6">
            <span class="bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Güvenli Dijital Araç Kartı</span>
            <h1 class="text-2xl font-bold mt-3 text-white">35 APK 544</h1>
            <p class="text-sm text-slate-400 mt-1">Numaranız gizli kalır. Tek dokunuşla bildirim alın.</p>
        </div>

        <!-- Hızlı Uyarı Menüleri -->
        <div class="space-y-3">
            <button onclick="sendAlert('💥 Arabana Çarptım!')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg">
                <span>💥 Arabana Çarptım</span>
            </button>

            <button onclick="sendAlert('🅿️ Araç Yanlış Yere Park Edilmiş')" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>🅿️ Araç Yanlış Yere Park Edilmiş</span>
            </button>

            <button onclick="sendAlert('🪟 Aracın Camı Açık Kalmış')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>🪟 Cam Açık</span>
            </button>

            <button onclick="sendAlert('🚪 Aracın Kapıları Açık Kalmış')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>🚪 Kapılar Açık</span>
            </button>

            <button onclick="sendAlert('💡 Aracın Farları / Işıkları Açık Kalmış')" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>💡 Işıklar Açık</span>
            </button>

            <button onclick="openModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 border border-slate-600">
                <span>💬 Araç Sahibine Mesaj Gönder</span>
            </button>
        </div>
        
        <!-- Bildirim Durum Kutusu -->
        <div id="statusMessage" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-medium"></div>
    </div>

    <!-- Özel Mesaj Modalı -->
    <div id="msgModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-md p-6 rounded-2xl border border-slate-700">
            <h3 class="text-lg font-bold mb-3 text-white">Araç Sahibine Not Bırak</h3>
            <textarea id="customText" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="Mesajınızı buraya yazın..."></textarea>
            <div class="flex space-x-3 mt-4">
                <button onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl text-sm font-medium">İptal</button>
                <button onclick="sendCustomMessage()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-sm font-medium text-white">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        // TELEGRAM AYARLARINIZ (Aşağıdaki tırnak içerisine kendi bilgilerinizi yazın)
        const TELEGRAM_BOT_TOKEN = "8812206597:AAG02RDssDPdW12MfVGJop27nGAIBc75MXI"; 
        const TELEGRAM_CHAT_ID = "5792521942";

        async function sendAlert(messageText) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-slate-700 text-yellow-300";
            statusDiv.innerText = "Bildirim gönderiliyor...";
            statusDiv.classList.remove('hidden');

            const fullText = `🚗 Araç Uyarısı (35 APK 544):\n\n${messageText}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: fullText
                    })
                });

                if (response.ok) {
                    statusDiv.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-emerald-900/50 text-emerald-300 border border-emerald-700";
                    statusDiv.innerText = "✅ Bildirim araç sahibine başarıyla iletildi!";
                } else {
                    throw new Error();
                }
            } catch (error) {
                statusDiv.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-rose-900/50 text-rose-300 border border-rose-700";
                statusDiv.innerText = "❌ Gönderim başarısız oldu. Lütfen tekrar deneyin.";
            }

            setTimeout(() => { statusDiv.classList.add('hidden'); }, 4000);
        }

        function openModal() {
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function sendCustomMessage() {
            const text = document.getElementById('customText').value;
            if(!text.trim()) return;
            closeModal();
            sendAlert(`💬 Özel Mesaj: ${text}`);
            document.getElementById('customText').value = '';
        }
    </script>
</body>
</html>
