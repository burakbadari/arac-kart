<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç İletişim Asistanı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <!-- Araç Bilgi Alanı -->
        <div class="text-center mb-6">
            <span class="bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Akıllı Araç Kartı</span>
            <h1 class="text-2xl font-bold mt-3 text-white">35 APK 544</h1>
            <p class="text-sm text-slate-400 mt-1">Araç sahibiyle güvenli bir şekilde iletişime geçin.</p>
        </div>

        <!-- Hızlı İşlem Menüleri -->
        <div class="space-y-3">
            <button onclick="sendAction('Araç Sahibini Ara', 'tel')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg">
                <span>📞 Araç Sahibini Ara</span>
            </button>

            <button onclick="sendAction('Arabana çarptım!', 'whatsapp')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>💥 Arabana Çarptım</span>
            </button>

            <button onclick="sendAction('Araç yanlış yere park edilmiş.', 'whatsapp')" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>🅿️ Araç Yanlış Yere Park Edilmiş</span>
            </button>

            <button onclick="sendAction('Aracının camı açık kalmış.', 'whatsapp')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>🪟 Cam Açık</span>
            </button>

            <button onclick="sendAction('Aracının kapıları açık kalmış.', 'whatsapp')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>🚪 Kapılar Açık</span>
            </button>

            <button onclick="sendAction('Aracının farları / ışıkları açık kalmış.', 'whatsapp')" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2">
                <span>💡 Işıklar Açık</span>
            </button>

            <button onclick="openQuestionModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 border border-slate-600">
                <span>💬 Araç Sahibine Soru Sor</span>
            </button>
        </div>
    </div>

    <!-- Soru Sorma Modal (İsteğe Bağlı) -->
    <div id="questionModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-md p-6 rounded-2xl border border-slate-700">
            <h3 class="text-lg font-bold mb-3">Araç Sahibine Mesaj Gönder</h3>
            <textarea id="customMessage" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500" placeholder="Mesajınızı buraya yazın..."></textarea>
            <div class="flex space-x-3 mt-4">
                <button onclick="closeQuestionModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl text-sm font-medium">İptal</button>
                <button onclick="sendCustomMessage()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-sm font-medium">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        const myPhoneNumber = "905069771107"; // Kendi telefon numaranız

        function sendAction(message, type) {
            if (type === 'tel') {
                window.location.href = `tel:+${myPhoneNumber}`;
            } else {
                const encodedMsg = encodeURIComponent(`Merhaba, aracınız hakkında: ${message}`);
                window.open(`https://wa.me/${myPhoneNumber}?text=${encodedMsg}`, '_blank');
            } Hazırlık
        }

        function openQuestionModal() {
            document.getElementById('questionModal').classList.remove('hidden');
        }

        function closeQuestionModal() {
            document.getElementById('questionModal').classList.add('hidden');
        }

        function sendCustomMessage() {
            const msg = document.getElementById('customMessage').value;
            if(!msg) return;
            const encodedMsg = encodeURIComponent(`Araç Sahibi Soru/Mesaj: ${msg}`);
            window.open(`https://wa.me/${myPhoneNumber}?text=${encodedMsg}`, '_blank');
            closeQuestionModal();
        }
    </script>
</body>
</html>
